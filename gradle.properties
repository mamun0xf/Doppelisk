org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Some aarch64 build-tools builds exit successfully from `aapt2 optimize`
# without writing its output, which produces an APK with no manifest and no
# resources. Package the linked resource archive directly instead.
android.enableResourceOptimizations=false
